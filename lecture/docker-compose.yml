services:
  backend:
    build: ./backend
    # Ne pas publier le port sur l'hôte.
    # Le nginx du frontend fait office de proxy inverse vers backend:8000
    # sur le même réseau Docker ; un accès direct depuis l'extérieur est donc inutile.
    # (Le publier ferait aussi apparaître le port 8000 dans la liste des ports du Codespace, ce qui prêterait à confusion)
    expose:
      - "8000"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
