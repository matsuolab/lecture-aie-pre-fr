server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA : revenir à index.html si aucun fichier statique ne correspond
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverse vers le backend
    # Le navigateur peut toujours envoyer ses requêtes à l'origine depuis laquelle il accède à l'application,
    # sans avoir à coder en dur le nom d'hôte ou le port du backend dans le frontend
    location /app/api {
        proxy_pass http://backend:8000/app/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
